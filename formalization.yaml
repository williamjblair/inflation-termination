version: "v0.4"

project:
  name: "Termination of the classical inflation hierarchy on pair-source networks"
  description: >-
    Machine-checked Lean 4 proofs of two theorems about the classical inflation hierarchy.
    The headline theorem, TriangleInflation.Graph.classification_NW, classifies the
    scenarios on which the hierarchy terminates: for a pair-source scenario with binary
    observations, some finite Navascués–Wolfe order characterizes compatibility iff every
    connected component is a double-star, and then order two suffices. A pair-source
    scenario is a finite simple graph without isolated vertices, one binary observed
    variable per vertex and one independent latent source per edge; a double-star is a tree
    of diameter at most three. The terminating half reconstructs a model on a double star
    from its order-two inflation. The nonterminating half supplies, at every order, a
    strictly positive law that passes the order-t test and has no model: a parity target on
    an induced cycle or a bilocal target on an induced five-observer path, moved to the
    ambient graph by induced-subgraph transport and made positive by independent local
    flips. The same development proves the classification for the ancestral-independence
    and recursively expressible hierarchies, and proves that the latter two coincide on
    every pair-source scenario.
    The second theorem, TriangleInflation.no_finite_characterizing_order, is the triangle
    case made quantitative: for every order t ≥ 1 there is an explicit rational three-bit
    law that is feasible at order t for the ancestral-independence hierarchy I^AI_t, hence
    for the Navascués–Wolfe hierarchy I^NW_t, and is not triangle compatible. This answers,
    in the negative for the triangle, the question Navascués and Wolfe (2020, §4.1) raise
    about whether some finite order settles exact compatibility; their hierarchy is
    asymptotically complete, so each incompatible law is rejected at some finite order, but
    the rejecting order cannot be bounded uniformly. The witnesses are
    P_t = Q(ε_t, r_t) with ε_t = 1/(2t³) and r_t = (1 − ε_t)^(t−1), where
    Q(ε,r) = ε δ_000 + (1 − ε) Bern(r)^⊗3. Membership is proved by an explicit inflation
    law on the order-t copied observations: independent Bernoulli defect bits on the cube
    [t]³ of source-copy indices together with independent private bits, with an observation
    outputting 1 exactly when its private bit and every defect on its line vanish. That law
    is S_t³-symmetric, has the tensor power P^⊗t as its diagonal law, and satisfies the
    injectable-marginal and ancestral-independence prescriptions. Incompatibility comes
    from the Finner inequality P(000)² ≤ P_A(0) P_B(0) P_C(0), which P_t violates by at
    least ε_t²/2 > 0; the inequality is proved both for finite latent alphabets and, in
    FinnerMeasure.lean, for arbitrary measurable latent spaces.
    The library also formalizes the order-t fan inequalities and their rejecting-order
    corollary, the family R_p with rejecting order 2 at every distance, the Θ(ε^{-1/3})
    bounds on the first rejecting order along P_ε, the order-t second-moment rate bound and
    its convex-order sharpening, the quantitative parity rigidity behind the cycle distance
    bound, and the triangle witness at q = 1/(16t). The two registry statements in
    Palomar/TriangleInflation/ import Mathlib alone and carry their definitions verbatim
    from TriangleInflation/Defs.lean and TriangleInflation/Graph/Defs.lean.
  authors: ["William Blair"]
  responsible_maintainers: ["William Blair"]
  license: "MIT"

sources:
  - title: "Inflation for Classical Pair-Source Networks: Termination and Quantitative Obstructions"
    authors: ["William Blair"]
    id: "paper/main.pdf (this repository; not yet posted to arXiv)"
    type: "preprint"
    location: >-
      Theorem 4.2 (thm:classification), Section 4, with the reconstruction half in Section 5
      and the witnesses in Sections 6 and 7; Theorem 8.2 (thm:main) and the corollary that
      follows it, with the construction in Section 8.1, the incompatibility in Section 8.2
      and the injectable-set characterization in Appendix A; the formal-verification
      statement is Section 16 (sections/11-reproducibility.tex)
    relationship: "formalizes"
    author_endorsement: "participated"
    note: >-
      The manuscript is included in this repository under paper/ (main.pdf and its LaTeX
      sources) together with its claim, non-claim, priority, reproduction and release
      documents under paper/release/. It is not yet posted to arXiv; this registry entry is
      intended to precede it and to be cited by it. Its Section 16 ("Formal verification")
      and paper/release/NONCLAIMS.md state exactly what this repository proves and what it
      leaves unformalized.
  - title: "Inflation for quantum causal structures"
    authors: ["Miguel Navascués", "Elie Wolfe"]
    id: "https://doi.org/10.1007/s10955-020-02561-9"
    type: "paper"
    location: "§4.1, the open question whether some finite inflation order settles exact compatibility, and the order-2 P_v/Finner example; Theorem 1 and (A7), asymptotic completeness"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The question both theorems answer, and the source of the asymptotic completeness they
      are set against. Their §4.1 non-termination result concerns causal optimization, not
      compatibility, and is the strongest located predecessor
      (paper/release/PRIORITY_AUDIT.md).
  - title: "The inflation technique for causal inference with latent variables"
    authors: ["Elie Wolfe", "Robert W. Spekkens", "Tobias Fritz"]
    id: "https://doi.org/10.1515/jci-2017-0020"
    type: "paper"
    location: "Definitions 4 and 7: injectable sets, ancestral independence, the expressible-set recursion"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The definitions formalized as Injectable, AncestrallyIndependent and AIFeasible in
      TriangleInflation/Defs.lean for the triangle, and as GInjectable, IsAISet, Expressible
      and GExpFeasible in TriangleInflation/Graph/Defs.lean for a general pair graph. The
      gluing rule of their Definition 7 is glueLaw.
  - title: "A generalization of Hölder's inequality and some probability inequalities"
    authors: ["Helmut Finner"]
    id: "https://doi.org/10.1214/aop/1176989541"
    type: "paper"
    location: "the generalized Hölder inequality specializing to P(000)² ≤ P_A(0) P_B(0) P_C(0) on the triangle"
    relationship: "background"
    author_endorsement: "n/a"
  - title: "Genuine quantum nonlocality in the triangle network"
    authors: ["Marc-Olivier Renou", "Elisa Bäumer", "Sadra Boreiri", "Nicolas Brunner", "Nicolas Gisin", "Salman Beigi"]
    id: "https://doi.org/10.1103/PhysRevLett.123.140401"
    type: "paper"
    location: "the classical triangle Finner inequality via two Cauchy–Schwarz steps"
    relationship: "background"
    author_endorsement: "n/a"
    note: >-
      The proof strategy of TriangleInflation.finner_of_compatible follows the two
      Cauchy–Schwarz steps recorded there.
  - title: "Universal bound on the cardinality of local hidden variables in networks"
    authors: ["Denis Rosset", "Nicolas Gisin", "Elie Wolfe"]
    id: "https://doi.org/10.26421/QIC18.11-12-2"
    type: "paper"
    location: "bounded finite latent cardinality suffices; compatible sets are closed and semialgebraic"
    relationship: "background"
    author_endorsement: "n/a"
    note: >-
      Quoted, not formalized. It is what would justify reading the graph development's
      finite-latent compatible set as the general one; see fidelity.divergences.
  - title: "Towards a minimal example of quantum nonlocality without inputs"
    authors: ["Sadra Boreiri", "Antoine Girardin", "Bo Yang", "Nicolas Brunner", "Pavel Sekatski"]
    id: "https://doi.org/10.1103/PhysRevA.107.062413"
    type: "paper"
    location: "exact parity rigidity for classical models of perfect-correlation targets on cycles"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The exact rigidity statement that TriangleInflation.Graph.parity_rigidity formalizes
      for the cycle target. The quantitative form used for the distance bound,
      CycleModelAux.quant_rigidity, is proved here and is not theirs.

