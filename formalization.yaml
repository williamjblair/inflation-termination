status:
  scope: >-
    Two complete, kernel-checked developments, with one registry statement each.
    The pair-source graph development (TriangleInflation/Graph/, 17 modules) proves the
    classification theorem for all three hierarchies, the coincidence of the recursively
    expressible and ancestral-independence tests, soundness and nesting of the three tests,
    the trail criterion and the root-sink lemma, source-disjoint independence at order two,
    induced-subgraph transport, the exhaustion lemma, the double-star reconstruction with
    its labelling step, the cycle target with exact and quantitative parity rigidity, its
    witness at every order, its incompatibility and its distance bound, the corrected
    Fourier density in the triangle case and the triangle witness at q = 1/(16t), the
    five-path target with the bilocal inequality, its distance bound and its witness at
    every order, local flips, and the bridge identifying the triangle case with the triangle
    module. Observed variables are binary and latent alphabets finite throughout.
    The triangle development (TriangleInflation/) proves the nontermination theorem and the
    supporting work it rests on: the Finner inequality for finite-latent triangle models and,
    in FinnerMeasure.lean, for arbitrary measurable latent spaces; the defect-cube inflation
    law with its symmetry, diagonal and injectable marginals; ancestral independence from
    disjoint root supports; the explicit violation margin; the order-t fan inequalities and
    their rejecting-order corollary; the family R_p; the Θ(ε^{-1/3}) bounds along P_ε; the
    order-t second-moment rate bound and the convex-order sharpening with the bound
    √7/(2√t).
    Palomar/TriangleInflation/ holds two Comparator comparisons, each a Challenge importing
    only Mathlib, a Solution delegating to the library proof, and a configuration naming the
    compared declaration. Audit.lean prints the axioms of both registry statements and of
    every library declaration the Coverage table of README.md names; scripts/check_axioms.sh
    is the gate.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "TriangleInflation.Graph.classification_NW"
      file: "PalomarSolutions/TriangleInflationClassification.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Palomar/TriangleInflation/classification-comparator.json"
      literature_dependencies: []
    - declaration: "TriangleInflation.no_finite_characterizing_order"
      file: "PalomarSolutions/TriangleInflation.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Palomar/TriangleInflation/comparator.json"
      literature_dependencies: []

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5", "claude-fable-5-1"]
      framework: "Claude Code agent sessions"
      tool_setup: >-
        The triangle development was produced in Claude Code agent sessions directed and
        audited by the author: Claude Fable 5.1 planned the file layout, reviewed every
        theorem statement against the manuscript before proofs were attempted, and audited
        the result; Claude Opus 5 subagents wrote the definitions skeleton and the proofs,
        one file each, in parallel. It was produced alongside an exact-rational certificate
        suite that checks the order 1, 2 and 3 inflation linear programs and the fan
        certificates independently of Lean. Those certificates are described in
        paper/release/REPRODUCE.md and appendix paper/appendices/C-certificates.tex; the
        Lean proofs are analytic and do not depend on them. Exact model identifiers and
        per-session costs were not recorded for these sessions and are not reconstructed
        here.
      prompting_notes: >-
        The manuscript was written first and the formalization follows it theorem by
        theorem; the statement-to-declaration correspondence is the Coverage table of
        README.md.
    - method: "agent"
      models: ["claude-fable-5-1", "claude-opus-5"]
      framework: "Claude Code agent sessions, 2026-09-14"
      tool_setup: >-
        The pair-source graph development, FinnerMeasure.lean and ConvexOrder.lean were
        produced on 2026-09-14 in the same way, at larger scale: Claude Fable 5.1 wrote the
        definitions file and the statement skeletons, directed the session and audited every
        finished module against the manuscript; Claude Opus 5 subagents proved one module
        each, in parallel, each reporting back the statements it had to change. Two
        skeleton statements were found false by the provers and removed rather than
        weakened; each removal is recorded in the header of the module it was cut from.
        The classification-set certificates (cycles, five-path, square, triangle, low-order
        square) were replayed independently of Lean; the Lean proofs do not depend on them.
      prompting_notes: >-
        Each subagent was given the manuscript section, the definitions file and one module
        to prove, and was told to report any statement it could not prove as stated rather
        than adjust it silently. The one statement that survived as unproved, the square
        witness of Theorem 6.11, is kept outside this repository.
  spend_usd: "not reconstructed"
  notes: >-
    lake build followed by scripts/check_axioms.sh is the whole gate: it refuses a literal
    open proof anywhere under TriangleInflation/ or PalomarSolutions/, requires each of the
    two Challenges to carry exactly one, regenerates both Challenges from
    TriangleInflation/Defs.lean and TriangleInflation/Graph/Defs.lean and fails if a file on
    disk differs, and fails on any axiom outside propext, Classical.choice and Quot.sound.

fidelity:
  divergences: >-
    The graph development. (1) Observed variables are binary: outcomes are Bool. The
    manuscript's Remark 4.4 extends the classification to any fixed finite observed
    alphabets, and that transfer is not formalized. (2) Latent alphabets are finite:
    GCompatible quantifies over a GModel whose latent spaces are Fintypes, where the
    mathematics allows arbitrary measurable latent spaces. The formal compatible set is
    therefore a priori a subset of the general one, so "not compatible" is the weaker of the
    two readings, and the nonterminating half of the classification asserts the weaker one.
    (3) The recursively expressible test IS formalized on the graph side: dsep is the trail
    criterion for the depth-one inflation DAG, Expressible is the Wolfe–Spekkens–Fritz
    closure, and gExpFeasible_iff_gAIFeasible proves I^exp_t = I^AI_t on every pair-source
    scenario. The triangle module still omits I^exp_t, so statements there about membership
    are the weaker halves; the graph module supplies the stronger ones through the bridge
    theorems gNWFeasible_triangle_iff, gAIFeasible_triangle_iff and gCompatible_triangle_iff.
    The triangle module. (4) The arbitrary-latent-space form of the nontermination theorem
    is proved: FinnerMeasure.lean defines TriangleCompatibleM over arbitrary probability
    spaces with measurable stochastic responses, proves the Finner inequality there
    (finner_of_compatibleM) and gives no_finite_characterizing_orderM. The elementary
    finite-latent form is kept alongside it, and is the one the registry statement uses.
    (5) Laws are bare real weight functions on finite types with the predicate IsLaw, not
    Mathlib Measures or PMFs; all inequalities are real-valued. The first rejecting order
    t_min is Nat.sInf of the set of rejecting orders, which returns 0 when that set is
    empty, so every statement about it either exhibits a rejecting order or assumes one.
    Asymptotic completeness itself is quoted from Navascués–Wolfe, not formalized.
    Paper results outside this development, with no Lean statement at all: the square
    witness of Theorem 6.11 (proved neither here nor anywhere; the manuscript states it with
    its certificate evidence, and the Lean statement with an open proof is kept in a
    separate library that this repository does not contain), the larger-alphabet transfer of
    Remark 4.4, Lemma 6.13, Corollaries 6.14 and 6.15, Theorem 6.18, Proposition 6.20 and
    its lemmas, Appendix C, the distance asymptotics of Theorem 11.1 and Corollary 11.2, the
    2^{Θ(B)} bit-length law of Proposition 13.1, the limit form of Proposition 10.1 and
    Corollary 8.3.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Kernel-checked and axiom-audited in this repository by the author; no independent human
    review of the mathematics has been performed, and the manuscript has not been refereed
    or posted. The priority audit in paper/release/PRIORITY_AUDIT.md records
    PRIORITY_NOT_KILLED, with Navascués–Wolfe 2020 §4.1 as the strongest located
    predecessor, and does not certify firstness. Its addendum of 2026-09-14 records a
    targeted sweep of the pair-source sections: no predecessor was located for the
    classification beyond stars, for I^exp = I^AI, for the all-order witnesses, for the
    Θ(1/t) bounds, for the source-free convex-order constant, for the order conversion or
    for the second-order separations; attribution was corrected for exact parity rigidity
    (Boreiri et al. 2023, not 2025). The theses of Wolfe and Pozas-Kerstjens remain unswept.
    Comparator was run locally on both Challenge and Solution pairs on 2026-09-14 and
    accepted both; that run used Comparator's fake-landrun shim, since landrun does not
    exist on macOS, so it checked the comparison and not the sandbox isolation. Both
    statements are submitted to Palomar to obtain the registry's independent check under the
    real sandbox.

alignment:
  namespaces: ["TriangleInflation", "TriangleInflation.Graph"]
  statements:
    - source: "For which causal scenarios does some finite order of classical inflation characterize compatibility? (paper Theorem 4.2; the pair-source class, binary observations)"
      lean: "TriangleInflation.Graph.classification_NW"
      module: "Palomar.TriangleInflation.ClassificationChallenge"
      status: "proved"
      note: >-
        Answer: exactly the scenarios whose every connected component is a double-star, and
        then order two suffices. Proof via TriangleInflation.Graph.classification_NW_lib in
        TriangleInflation/Graph/ClassificationTheorem.lean, from doubleStar_terminates (the
        order-two reconstruction) and nontermination_of_not_doubleStar (exhaustion into an
        induced cycle or five-path, the cycle and five-path witnesses, induced transport and
        local flips). The library carries the _lib suffix so that the Solution can declare
        the plain name Comparator compares. The same file proves classification_AI and
        classification_exp.
    - source: "Does some finite order of classical inflation characterize compatibility in the binary triangle? (Navascués–Wolfe 2020, §4.1; answered no, paper Theorem 8.2 and its corollary)"
      lean: "TriangleInflation.no_finite_characterizing_order"
      module: "Palomar.TriangleInflation.Challenge"
      status: "proved"
      note: >-
        Answer no, with an explicit rational family and an explicit violation margin. Proof
        via TriangleInflation.no_finite_characterizing_order_lib in
        TriangleInflation/Main.lean, from main_membership (the defect-cube inflation law) and
        main_violation (the Finner margin ε_t²/2). The triangle is the smallest scenario the
        classification puts on the nonterminating side, so this theorem is the quantitative
        form of that case. The arbitrary-latent-space form is
        no_finite_characterizing_orderM in TriangleInflation/FinnerMeasure.lean.

acknowledgements: >-
  Miguel Navascués and Elie Wolfe for the question and for the order-2 example the triangle
  construction generalizes; Elie Wolfe, Robert Spekkens and Tobias Fritz for the inflation
  definitions and the expressible-set recursion; Helmut Finner and Marc-Olivier Renou and
  coauthors for the inequality that supplies the triangle incompatibility; Sadra Boreiri and
  coauthors for the exact parity rigidity the cycle witnesses rest on; Denis Rosset, Nicolas
  Gisin and Elie Wolfe for the finite latent cardinality theorem the formalization boundary
  leans on.
