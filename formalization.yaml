    id: "paper/main.pdf (this repository; not yet posted to arXiv)"
    type: "preprint"
    location: "Theorem 3.2 (thm:main) and the corollary that follows it; the construction is Section 3.1, the incompatibility Section 3.2, the injectable-set characterization Appendix A"
    relationship: "formalizes"
    author_endorsement: "author"
    note: >-
      The manuscript is included in this repository under paper/ (main.pdf and its LaTeX
      sources) together with its claim, non-claim, priority and reproduction documents
      under paper/release/. It is not yet posted to arXiv; this registry entry is intended
      to precede it and to be cited by it. Its Section 11 ("Formal verification") and
      paper/release/NONCLAIMS.md state exactly what this repository proves and what it
      leaves unformalized.
  - title: "Inflation for quantum causal structures"
    authors: ["Miguel Navascués", "Elie Wolfe"]
    id: "https://doi.org/10.1007/s10955-020-02561-9"
    type: "paper"
    location: "§4.1, the open question whether some finite inflation order settles exact compatibility, and the order-2 P_v/Finner example; Theorem 1 and (A7), asymptotic completeness"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The question this theorem answers for the triangle, and the source of the
      asymptotic completeness the theorem is set against. Their §4.1 non-termination
      result concerns causal optimization, not compatibility, and is the strongest
      located predecessor (paper/release/PRIORITY_AUDIT.md).
  - title: "The inflation technique for causal inference with latent variables"
    authors: ["Elie Wolfe", "Robert W. Spekkens", "Tobias Fritz"]
    id: "https://doi.org/10.1515/jci-2017-0020"
    type: "paper"
    location: "Definitions 4 and 7: injectable sets, ancestral independence, the expressible-set recursion"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The definitions formalized as Injectable, AncestrallyIndependent and AIFeasible in
