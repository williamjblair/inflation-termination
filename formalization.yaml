status:
  scope: >-
    Complete, kernel-checked proof of the headline nontermination theorem and of the
    supporting development it rests on: the Finner inequality for finite-latent triangle
    models, the defect-cube inflation law and its symmetry, diagonal and injectable
    marginals, ancestral independence from disjoint root supports, the explicit violation
    margin, the order-t fan inequalities and their rejecting-order corollary, the family
    R_p, the Θ(ε^{-1/3}) bounds along P_ε, and the order-t second-moment rate bound. The
    registry-shaped statement in Palomar/TriangleInflation/ is one Comparator comparison: a
    Challenge importing only Mathlib, a Solution delegating to the library proof, and the
    configuration naming the compared declaration. Audit.lean prints the axioms of the
    registry statement and of every library theorem the manuscript's coverage table names;
    scripts/check_axioms.sh is the gate.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "TriangleInflation.no_finite_characterizing_order"
      file: "PalomarSolutions/TriangleInflation.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Palomar/TriangleInflation/comparator.json"
      literature_dependencies: []

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5", "claude-fable-5-1"]
      framework: "Claude Code agent sessions"
      tool_setup: >-
        The Lean development was produced in Claude Code agent sessions directed and audited by
        the author: Claude Fable 5.1 planned the file layout, reviewed every theorem statement
        against the manuscript before proofs were attempted, and audited the result; Claude
        Opus 5 subagents wrote the definitions skeleton and the proofs, one file each, in
        parallel. It was produced alongside an exact-rational certificate suite that checks the order 1, 2
        and 3 inflation linear programs and the fan certificates independently of Lean.
        Those certificates are described in paper/release/REPRODUCE.md and appendix
        paper/appendices/C-certificates.tex; the Lean proofs are analytic and do not depend
        on them. Exact model identifiers and per-session costs were not recorded and are not
        reconstructed here.
      prompting_notes: >-
        The manuscript was written first and the formalization follows it theorem by
        theorem; the statement-to-declaration correspondence is the table reproduced in
        README.md under "Coverage".
  spend_usd: "not reconstructed"
  notes: >-
    lake build followed by scripts/check_axioms.sh is the whole gate: it refuses a literal
    sorry or admit anywhere under TriangleInflation/ or PalomarSolutions/, requires the
    Challenge to carry exactly one sorry, regenerates the Challenge from
    TriangleInflation/Defs.lean and fails if the file on disk differs, and fails on any
    axiom outside propext, Classical.choice and Quot.sound.

fidelity:
  divergences: >-
    Three recorded boundaries, all in the safe direction for the theorem as stated. (1)
    Finite latent alphabets: TriangleCompatible quantifies over TriangleModels whose three
    latent spaces are Fintypes, where the paper (Section 2) allows arbitrary measurable
    latent spaces. The reduction to bounded finite alphabets (Rosset–Gisin–Wolfe 2018) is
    quoted in the paper and is not formalized, so the formal compatible set is a priori a
    subset of the paper's C_tri and the formalized "not triangle compatible" is the weaker
    of the two readings. (2) The recursively expressible hierarchy I^exp_t (paper
    Definition 2.3) is not formalized: it needs d-separation in the inflated causal graph
    and the Wolfe–Spekkens–Fritz recursion. Only I^NW_t (NWFeasible) and I^AI_t
    (AIFeasible) are defined, and the theorem asserts membership in the stronger of those
    two; since I^exp_t ⊆ I^AI_t ⊆ I^NW_t, the formalized membership is the weaker half of
    the paper's Theorem 3.1. (3) Laws are bare real weight functions on finite types with
    the predicate IsLaw, not Mathlib Measures or PMFs; all inequalities are real-valued.
    The first rejecting order t_min is Nat.sInf of the set of rejecting orders, which
    returns 0 when that set is empty, so every statement about it either exhibits a
    rejecting order or assumes one; asymptotic completeness itself is quoted from
    Navascués–Wolfe, not formalized. Paper results outside this development: Theorem 6.1
    and Corollary 6.2 (distance asymptotics) and Proposition 8.1 (the 2^{Θ(B)} bit-length
    law) are unformalized, and Propositions 5.1 and 7.1 are formalized in their finite
    parts only.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Kernel-checked and axiom-audited in this repository by the author; no independent human
    review of the mathematics has been performed, and the manuscript has not been refereed
    or posted. The priority audit in paper/release/PRIORITY_AUDIT.md records
    PRIORITY_NOT_KILLED with Navascués–Wolfe 2020 §4.1 as the strongest located
    predecessor, and does not certify firstness. The statement is submitted to Palomar to
    obtain the registry's independent dual-kernel Comparator check.

alignment:
  namespace: "TriangleInflation"
  statements:
    - source: "Does some finite order of classical inflation characterize compatibility in the binary triangle? (Navascués–Wolfe 2020, §4.1; answered no, paper Theorem 3.2 and its corollary)"
      lean: "TriangleInflation.no_finite_characterizing_order"
      module: "Palomar.TriangleInflation.Challenge"
      status: "proved"
      note: >-
        Answer no. Proof via TriangleInflation.no_finite_characterizing_order_lib in
        TriangleInflation/Main.lean, from main_membership (the defect-cube inflation law)
        and main_violation (the Finner margin ε_t²/2). The library carries the _lib suffix
        so that the Solution can declare the plain name Comparator compares.

