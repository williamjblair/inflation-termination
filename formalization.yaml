version: "v0.4"

project:
  name: "Nontermination of the classical inflation hierarchy for the triangle scenario"
  description: >-
    A machine-checked Lean 4 proof that no finite order of the classical inflation
    hierarchy characterizes compatibility in the binary triangle causal scenario. The
    headline theorem, TriangleInflation.no_finite_characterizing_order, says that for
    every order t ≥ 1 there is a three-bit law P that is a probability law, that is
    feasible at order t for the ancestral-independence hierarchy I^AI_t and hence for the
    Navascués–Wolfe hierarchy I^NW_t, and that is not triangle compatible. This answers,
    in the negative for the triangle, the question Navascués and Wolfe (2020, §4.1) raise
    about whether some finite order settles exact compatibility; their hierarchy is
    asymptotically complete, so each incompatible law is rejected at some finite order,
    but the rejecting order cannot be bounded uniformly. The witnesses are the explicit
    rational family P_t = Q(ε_t, r_t) with ε_t = 1/(2t³) and r_t = (1 − ε_t)^(t−1), where
    Q(ε,r) = ε δ_000 + (1 − ε) Bern(r)^⊗3. Membership is proved by an explicit inflation
    law on the order-t copied observations: independent Bernoulli defect bits on the cube
    [t]³ of source-copy indices together with independent private bits, with an
    observation outputting 1 exactly when its private bit and every defect on its line
    vanish. That law is S_t³-symmetric, has the tensor power P^⊗t as its diagonal law, and
    satisfies the injectable-marginal and ancestral-independence prescriptions.
    Incompatibility comes from the Finner inequality P(000)² ≤ P_A(0) P_B(0) P_C(0),
    proved here for finite latent alphabets and stochastic responses, which P_t violates
    by at least ε_t²/2 > 0. The library also formalizes the order-t fan inequalities and
    their rejecting-order corollary, the family R_p with rejecting order 2 at every
    distance, the Θ(ε^{-1/3}) bounds on the first rejecting order along P_ε, and the
    order-t second-moment rate bound. The registry statement in
    Palomar/TriangleInflation/Challenge.lean imports Mathlib alone and carries the
    definitions verbatim from TriangleInflation/Defs.lean.
  authors: ["William Blair"]
  responsible_maintainers: ["William Blair"]
  license: "MIT"

sources:
